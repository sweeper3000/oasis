# From the repository root:
# docker compose -f compose.example.yaml up --build -d
services:
  oasis:
    image: oasis:external-storage-providers
    build:
      context: .
      dockerfile: docker/Dockerfile.source
    init: true
    restart: unless-stopped
    ports:
      # Use OASIS_BIND_ADDRESS=0.0.0.0 to allow access from other computers.
      - "${OASIS_BIND_ADDRESS:-127.0.0.1}:${OASIS_PORT:-8000}:8000"
    # Optional: uncomment environment and the entries you need.
    # environment:
      # Global encryption secret: use a 12+ character passphrase or 64 hex characters.
      # Leave this entry commented to use keys saved in Oasis settings.
      # Back up this key. Changing it makes existing encrypted files unreadable.
      # OASIS_STORAGE_KEY: "${OASIS_STORAGE_KEY:?Set an encryption passphrase or hexadecimal key}"
      # Private CA: also uncomment the secrets mount below.
      # OASIS_STORAGE_CA_CERT: /run/oasis-secrets/ca.pem
    volumes:
      # Required even when an external provider is the main drive.
      - oasis-data:/opt/oasis/data
      # Choose /home/storage during initial setup; retained in local/mount mode.
      - oasis-files:/home/storage
      # Optional: create ./secrets first; make files readable by UID 10001.
      # Set SFTP key/known_hosts paths in Settings to these container paths.
      # - ./secrets:/run/oasis-secrets:ro
    # Staging uses writable container disk at /opt/oasis/temp. Do not mount that
    # directory directly: Oasis removes/recreates it on startup. Remote videos
    # stream without staging. Other remote responses cache plaintext here until
    # unused for 24 hours, with no size cap. Allow space for this cache plus two
    # copies of the largest concurrent upload or internal file operation.

volumes:
  oasis-data:
  oasis-files:
